name: code-scanning

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  ansible-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ansible-linter (SARIF)
        run: python -m ansible_linter.cli lint examples --format sarif > ansible-linter.sarif
        continue-on-error: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ansible-linter.sarif
          category: ansible-linter

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-linter"
version = "0.1.0"
description = "Dependency-light static analysis for Ansible playbooks and roles"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Sergey Sannikov" }
]
license = "MIT"
dependencies = []

[project.scripts]
ansible-linter = "ansible_linter.cli:main"

[tool.setuptools.packages.find]
include = ["ansible_linter*"]
